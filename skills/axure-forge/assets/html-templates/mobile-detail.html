<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>移动端详情 · 建议宽 390、首屏高 844、纵向延展</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial; font-size: 14px; line-height: 1.4; color: #203046; background: #edf1f6; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 28px; line-height: 1.4; }
h2 { font-size: 18px; line-height: 1.4; }
h3 { font-size: 15px; line-height: 1.4; }
.muted { color: #65758a; }
button { height: 40px; padding: 0 18px; border: 1px solid #2157a6; background: #2157a6; color: #ffffff; font-size: 14px; }
input, select, textarea { border: 1px solid #c5cfdd; background: #ffffff; color: #203046; font-size: 14px; padding: 10px; }
input, select { height: 40px; }
.card { background: #ffffff; border: 1px solid #d7dfeb; border-radius: 6px; padding: 20px; }
.screen { width: 390px; min-height: 844px; background: #edf1f6; }
.mobile-header { display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 20px; background: #ffffff; }
.mobile-header button { height: 36px; padding: 0 12px; background: #ffffff; color: #2157a6; }
.mobile-header h1 { font-size: 18px; }
.mobile-content { padding: 20px; }
.mobile-content .card { margin-bottom: 16px; }
.mobile-title { font-size: 24px; line-height: 1.4; margin-bottom: 8px; }
.status { width: 84px; background: #e3effc; color: #2157a6; padding: 6px 12px; margin-top: 16px; }
.detail-row { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
.history { margin-top: 18px; }
.history p { margin-top: 8px; }
.mobile-actions button { width: 100%; height: 48px; }
.mobile-note { margin-top: 12px; font-size: 12px; color: #65758a; }
</style></head>
<body>
<!-- 移动端详情 · 建议宽 390、首屏高 844、纵向延展；尺寸为参考建议，使用前按确认结果修改。无 JavaScript，交互需在 RP 中另配。 -->
<div class="screen" data-forge-name="移动端详情页"><header class="mobile-header"><button data-axure-id="back">返回</button><h1>线索详情</h1><span>更多</span></header>
<main class="mobile-content"><section class="card" data-forge-name="线索概况"><h2 class="mobile-title">样例线索 A</h2><p class="muted">咨询记录已分配至销售一组</p><p class="status">待跟进</p></section>
<section class="card" data-forge-name="基本信息"><h2>基本信息</h2><div class="detail-row"><span class="muted">线索来源</span><span>在线咨询</span></div><div class="detail-row"><span class="muted">负责人</span><span>销售一组</span></div><div class="detail-row"><span class="muted">意向产品</span><span>产品方案 A</span></div><div class="detail-row"><span class="muted">跟进时间</span><span>今日 15:00</span></div></section>
<section class="card" data-forge-name="跟进记录"><h2>最近跟进</h2><div class="history"><p class="muted">今日 10:30</p><p>客户希望了解产品方案，已约定下午联系。</p></div><div class="history"><p class="muted">昨日 16:20</p><p>完成首次沟通，记录客户需求。</p></div></section>
<div class="mobile-actions"><button data-axure-id="add-followup">添加跟进记录</button><p class="mobile-note">内容增加时页面纵向延展，底部操作区当前随文档流排布。</p></div></main></div>
</body></html>
